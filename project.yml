name: ClaudeWeb17
options:
  bundleIdPrefix: dev.example
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ''
targets:
  ClaudeWeb17:
    type: application
    platform: iOS
    sources:
      - path: ClaudeWeb17/Sources
      - path: ClaudeWeb17/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.ClaudeWeb17
        INFOPLIST_KEY_CFBundleDisplayName: Claude Web
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Voice features on the Claude website may need microphone access.
        INFOPLIST_KEY_NSCameraUsageDescription: Allow web-based image capture when attaching a photo.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Allow selecting photos to attach to a conversation.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
      testTargets: []
